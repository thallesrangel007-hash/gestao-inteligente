<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão Inteligente</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="body-auth">
    
    <div class="card-auth">
        <!-- ÁREA DE LOGIN -->
        <div id="login-container" class="form-section">
            <div class="auth-header">
                <h1>Gestão Inteligente</h1>
                <p>Organize as suas finanças, conquiste os seus objetivos.</p>
            </div>
            
            <input type="email" id="login-email" placeholder="Seu e-mail">
            
            <!-- Senha com Olhinho -->
            <div style="position: relative; width: 100%; margin-bottom: 15px;">
                <input type="password" id="login-senha" placeholder="Sua senha" style="width: 100%; padding-right: 40px; margin-bottom: 0;">
                <button type="button" id="toggle-login-senha" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; color: #666;"><i class="fas fa-eye"></i></button>
            </div>
            
            <button id="btn-login" class="btn-principal">Entrar</button>
            
            <p class="auth-footer-text">Não tem uma conta? <a href="#" id="link-ir-cadastro">Cadastre-se aqui</a></p>
        </div>

        <!-- ÁREA DE CADASTRO -->
        <div id="cadastro-container" class="form-section" style="display: none;">
            <div class="auth-header">
                <h1>Criar Conta</h1>
                <p>Comece a controlar o seu futuro financeiro hoje.</p>
            </div>

            <input type="text" id="cadastro-nome" placeholder="Nome Completo" oninput="this.value = this.value.replace(/[0-9]/g, '')">
            <input type="tel" id="cadastro-telefone" placeholder="(00) 00000-0000" maxlength="15">
            <input type="email" id="cadastro-email" placeholder="Seu e-mail">
            
        
            <div style="position: relative; width: 100%; margin-bottom: 10px;">
                <input type="password" id="cadastro-senha" placeholder="Crie uma senha" style="width: 100%; padding-right: 40px; margin-bottom: 0;">
                <button type="button" id="toggle-cadastro-senha" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px; color: #666;"><i class="fas fa-eye"></i></button>
            </div>

            <!-- Confirmação de Senha -->
            <div style="position: relative; width: 100%; margin-bottom: 15px;">
                <input type="password" id="cadastro-confirma-senha" placeholder="Confirme sua senha" style="width: 100%; padding-right: 40px; margin-bottom: 0;">
                <button type="button" id="toggle-cadastro-confirma" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 16px;color: #666;">
                    <i class="fas fa-eye"></i> <!-- THE FIX IS HERE: Added the closing </i> tag -->
                </button>
            </div>
            
            <button id="btn-cadastrar" class="btn-principal">Criar Conta</button>
            
            <p class="auth-footer-text">Já tem uma conta? <a href="#" id="link-ir-login">Voltar para o Login</a></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
